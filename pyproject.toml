[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compressor-anomaly-detection-ml"
version = "0.1.0"
description = "Measurement-level Random Forest processing for compressor sensor data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
research = ["scipy>=1.11,<2", "npTDMS>=1.9,<2", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]

[project.scripts]
compressor-ml = "compressor_anomaly_detection_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: writes only to an explicitly configured isolated MySQL test database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
